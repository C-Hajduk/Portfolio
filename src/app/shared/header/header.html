<section>
  <div class="hero-wrapper">
    <a href="#hero" (click)="burgermenu.close()"><img src="assets/icons/logo4.png" alt="" /></a>

    <div class="wrapper">
      <div class="language_tuggle">
        <button
          class="btn1"
          [ngClass]="{ active: activeButton() === 'btn1' }"
          (click)="switchLanguage('btn1', 'en')"
        >
          EN
        </button>

        <button
          class="btn2"
          [ngClass]="{ active: activeButton() === 'btn2' }"
          (click)="switchLanguage('btn2', 'de')"
        >
          DE
        </button>
      </div>

      <div
        class="hamburger"
        [class]="{ 'open-animation': openMenu, 'close-animation': !openMenu }"
        (click)="burgermenu.switch()"
      ></div>
    </div>
  </div>
</section>
