@if (burgermenu.isOpen) {
  <section class="layout">
    <app-header></app-header>
    <div class="skipp">
      <div
        [class]="{ showBorder: activeIndex === 0 }"
        (mousedown)="openborder(0)"
        (mouseup)="hideBorder()"
      >
        <div class="hover-div"></div>
        <p (click)="navigateTo('about-me')">{{ 'ham-menu.aboutMe' | translate }}</p>
      </div>
      <div
        [class]="{ showBorder: activeIndex === 1 }"
        (mousedown)="openborder(1)"
        (mouseup)="hideBorder()"
      >
        <div class="hover-div"></div>
        <p (click)="navigateTo('skills')">{{ 'ham-menu.skills' | translate }}</p>
      </div>
      <div
        [class]="{ showBorder: activeIndex === 2 }"
        (mousedown)="openborder(2)"
        (mouseup)="hideBorder()"
      >
        <div class="hover-div"></div>
        <p (click)="navigateTo('portfolio')">{{ 'ham-menu.portfolio' | translate }}</p>
      </div>
    </div>
    <footer>
      <div class="contact">

        <div class="contact_wrapper">

          <div class="contact_text">
            <h2>{{ 'ham-menu.sayHi' | translate }}</h2>
            <p>christian.hajduk@outlook.de</p>
          </div>

          <div class="socials">
            <a href="https://github.com/C-Hajduk" target="_blank" rel="noopener noreferrer">
              <img src="/assets/icons/Github_button.svg" alt="Github" />
            </a>
            <a href="mailto:christian.hajduk@outlook.de">
              <img src="/assets/icons/Email_button.svg" alt="Email" />
            </a>
            <a href="https://www.linkedin.com/in/christian-hajduk" target="_blank" rel="noopener noreferrer">
              <img src="/assets/icons/Linkedin_button.svg" alt="Linkedin" />
            </a>
          </div>

        </div>
      </div>
    </footer>
  </section>
}
